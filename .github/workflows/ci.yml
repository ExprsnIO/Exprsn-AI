name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Console scripts parse
        run: for f in web/js/*.js web/js/screens/*.js; do node --check "$f"; done

  e2e:
    name: Console end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      # The suite starts the real server in-process (e2e/server.ts through tsx), so it needs the workspace's modules.
      - run: npm ci
      - name: Install the suite and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

  integration:
    name: Integration against PostgreSQL, MySQL, OpenLDAP and Redis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: exprsn, POSTGRES_PASSWORD: exprsn, POSTGRES_DB: exprsn_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U exprsn" --health-interval 3s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: exprsn_test, MYSQL_USER: exprsn, MYSQL_PASSWORD: exprsn }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 3s --health-timeout 3s --health-retries 40
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - name: Start OpenLDAP with the development seed
        run: |
          docker run -d --name openldap -p 389:389 \
            -e LDAP_ORGANISATION=Northwind -e LDAP_DOMAIN=northwind.local -e LDAP_ADMIN_PASSWORD=dev-ldap-admin -e LDAP_TLS=false \
            -v "$PWD/deploy/docker/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro" \
            osixia/openldap:1.5.0 --copy-service
          for i in $(seq 1 40); do
            docker exec openldap ldapsearch -x -H ldap://localhost -b ou=people,dc=northwind,dc=local -D cn=admin,dc=northwind,dc=local -w dev-ldap-admin uid=mokafor >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs openldap; exit 1
      - name: Turn on logical replication in PostgreSQL (knowledge replication test)
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U exprsn -d exprsn_test -c "ALTER SYSTEM SET wal_level = logical"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 40); do docker exec ${{ job.services.postgres.id }} pg_isready -U exprsn >/dev/null 2>&1 && exit 0; sleep 1; done
          exit 1
      - run: npm ci
      - run: npm run test:integration -w server
        env:
          TEST_PG_URL: postgres://exprsn:exprsn@127.0.0.1:5432/exprsn_test
          TEST_MYSQL_URL: mysql://exprsn:exprsn@127.0.0.1:3306/exprsn_test
          TEST_LDAP_URL: ldap://127.0.0.1:389
          TEST_LDAP_INSECURE: "true"
          TEST_LDAP_BIND_PW: dev-ldap-admin
          TEST_REDIS_URL: redis://127.0.0.1:6379

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/docker/Dockerfile -t exprsn-ai:ci .
      - name: Starts and answers health checks
        run: |
          docker run -d --name app -p 8080:8080 \
            -e NODE_ENV=development -e PUBLIC_URL=http://localhost:8080 -e DB_CLIENT=sqlite \
            -e SESSION_SECRET="$(openssl rand -hex 32)" -e DATA_KEY="$(openssl rand -base64 32)" exprsn-ai:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/readyz && exit 0; sleep 1; done
          docker logs app; exit 1

  supply-chain:
    name: Dependency audit and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      # Production dependencies only; high and critical advisories fail the build.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
      - name: CycloneDX SBOM of the npm workspace
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --output-format JSON --output-file sbom.cdx.json
          node -e "const s=require('./sbom.cdx.json'); console.log('CycloneDX', s.specVersion, (s.components||[]).length, 'top-level components')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-npm
          path: sbom.cdx.json
          retention-days: 90

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/docker/Dockerfile -t exprsn-ai:scan .
      # Fixed CRITICAL and HIGH findings in the OS packages or the bundled npm modules fail the build.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: exprsn-ai:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: CycloneDX SBOM of the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: always()
        with:
          image-ref: exprsn-ai:scan
          scan-type: image
          format: cyclonedx
          output: sbom-image.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-image
          path: sbom-image.cdx.json
          if-no-files-found: ignore
          retention-days: 90

  helm:
    name: Helm chart lint and render
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
      # From the release's CHECKSUMS file (kubeconform-linux-amd64.tar.gz); update together with the version.
      KUBECONFORM_SHA256: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: { version: v3.16.4 }
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint, render and validate every CI values file
        run: |
          chart=deploy/helm/exprsn-ai
          for f in "$chart"/ci/*.yaml; do
            echo "::group::$f"
            helm lint "$chart" -f "$f" --strict
            helm template ci "$chart" -f "$f" | kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
      - name: Refuses unsafe values
        run: |
          chart=deploy/helm/exprsn-ai
          # Several replicas without Redis, SQLite, and a plain http:// address in production must not render.
          for bad in secrets.REDIS_URL.name= config.database.client=sqlite config.publicUrl=http://ai.example.internal; do
            if helm template ci "$chart" -f "$chart/ci/default-values.yaml" --set "$bad" >/dev/null 2>&1; then
              echo "The chart rendered with --set $bad"; exit 1
            fi
          done

  loadtest:
    name: Streaming load test (in-process)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint the load test
        working-directory: server
        run: npx eslint loadtest
      # 50 users on 64 fake slots; the thresholds are looser than the 1.0 targets in docs/loadtest.md because shared
      # runners vary. The summary is kept as an artifact for comparison between runs.
      - name: Run
        working-directory: server
        shell: bash # -eo pipefail: the load test's exit code survives the tee
        run: |
          npx tsx loadtest/stream.ts --users 50 --messages 4 --parallel 16 --instances 4 \
            --max-error-rate 0 --max-p95-ttft-ms 500 --max-p99-ttft-ms 1000 --json | tee loadtest-summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: loadtest-summary
          path: server/loadtest-summary.json
          if-no-files-found: ignore
