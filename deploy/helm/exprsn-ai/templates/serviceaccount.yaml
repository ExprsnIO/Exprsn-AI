{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "exprsn-ai.serviceAccountName" . }}
  labels:
    {{- include "exprsn-ai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ or .Values.serviceAccount.automountServiceAccountToken .Values.zonesApply.enabled }}
{{- end }}
