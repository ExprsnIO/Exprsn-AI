{{- if eq .Values.migrations.mode "job" }}
{{- /*
  The hook runs before the release's own ConfigMap exists on a first install, so it brings a copy of the settings
  as a hook ConfigMap (created first, by weight) and removes both before the next run.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "exprsn-ai.fullname" . }}-migrate
  labels:
    {{- include "exprsn-ai.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  {{- include "exprsn-ai.configData" . | trim | nindent 2 }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "exprsn-ai.fullname" . }}-migrate
  labels:
    {{- include "exprsn-ai.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "exprsn-ai.fullname" . }}-migrate
  labels:
    {{- include "exprsn-ai.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migrations.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "exprsn-ai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
        {{- if .Values.networkPolicy.enabled }}
        exprsn.ai/zone: {{ .Values.networkPolicy.zoneLabel | quote }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ include "exprsn-ai.fullname" . }}-migrate{{ else }}{{ include "exprsn-ai.serviceAccountName" . }}{{ end }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "exprsn-ai.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/bin/tini", "--", "node", "server/dist/cli.js", "migrate"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            {{- include "exprsn-ai.envFrom" (dict "root" . "configMap" (printf "%s-migrate" (include "exprsn-ai.fullname" .))) | nindent 12 }}
          env:
            {{- include "exprsn-ai.env" . | trim | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      volumes:
        {{- include "exprsn-ai.secretVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
