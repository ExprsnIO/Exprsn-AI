# Production-shaped stack: the application server, PostgreSQL, Redis (job queue and multi-instance fan-out),
# and Ollama (profile "inference").
# TLS terminates in front of this stack (your reverse proxy or load balancer); the app listens on 127.0.0.1:8080.
#
#   ./gen-secrets.sh                                   # once: writes secrets/*.txt (mode 600)
#   cp ../config/identity.example.yaml identity.yaml   # then edit: your OpenLDAP / SQL user stores
#   PUBLIC_URL=https://ai.example.internal docker compose up -d
#   docker compose exec app node server/dist/cli.js admin:create --username root --display-name "Platform admin"
#   docker compose --profile inference up -d           # add Ollama (compose.gpu.yml for NVIDIA GPUs), then register
#                                                      # http://ollama:11434 as an instance under Admin > Pools
name: exprsn-ai

services:
  app:
    image: exprsn-ai:${EXPRSN_VERSION:-dev}
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL to the https:// address users open}
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      DB_CLIENT: pg
      DATABASE_URL_FILE: /run/secrets/database_url
      SESSION_SECRET_FILE: /run/secrets/session_secret
      DATA_KEY_FILE: /run/secrets/data_key
      # KMS: local wraps each tenant's data key with DATA_KEY. For OpenBao transit set KMS_PROVIDER=openbao,
      # OPENBAO_ADDR and OPENBAO_TOKEN_FILE (see docs/deploy.md).
      KMS_PROVIDER: ${KMS_PROVIDER:-local}
      REDIS_URL: redis://redis:6379
      BLOB_DIR: /var/lib/exprsn-ai/blobs
      SMTP_URL: ${SMTP_URL:-}
      SIEM_URL: ${SIEM_URL:-}
      IDENTITY_CONFIG: /etc/exprsn-ai/identity.yaml
      DEFAULT_TENANT: ${DEFAULT_TENANT:-default}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # identity.yaml references the LDAP bind password as file:/run/secrets/ldap_bind_password
    secrets: [database_url, session_secret, data_key, ldap_bind_password]
    volumes:
      - ./identity.yaml:/etc/exprsn-ai/identity.yaml:ro
      - appdata:/var/lib/exprsn-ai
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [app, data, inference]

  postgres:
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    restart: unless-stopped
    environment:
      POSTGRES_DB: exprsn_ai
      POSTGRES_USER: exprsn_ai
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exprsn_ai -d exprsn_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  redis:
    image: redis:8-bookworm@sha256:164c759a0c342ee69d08fc99219382b0fd682181465c0df2e0e6911f4c85d73c
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  # Model serving. This container is the Docker placement; bare-metal Ollama nodes are registered the same way,
  # as instances of a pool (see deploy/baremetal/ollama-node.md). It only joins the internal inference network:
  # no published port, no egress.
  ollama:
    profiles: [inference]
    # Pinned by digest; set OLLAMA_IMAGE to move to another release.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.4@sha256:8262851b2846b87c649eddf3e76beb270c52f4d1bc94559f47efde16b0841551}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_MAX_QUEUE: "16"
      OLLAMA_NUM_PARALLEL: "4"
    volumes: [ollama:/root/.ollama]
    networks: [inference]

networks:
  app: {}
  data: { internal: true }
  inference: { internal: true }

volumes:
  appdata: {}
  pgdata: {}
  redisdata: {}
  ollama: {}

secrets:
  database_url: { file: ./secrets/database_url.txt }
  session_secret: { file: ./secrets/session_secret.txt }
  data_key: { file: ./secrets/data_key.txt }
  postgres_password: { file: ./secrets/postgres_password.txt }
  ldap_bind_password: { file: ./secrets/ldap_bind_password.txt }
