# Development stack: the app against PostgreSQL, plus every kind of user store with seed users.
#   docker compose -f deploy/docker/compose.dev.yml up --build
#   open http://localhost:8080 and sign in as mokafor / Northwind-Dev-Password-1 (OpenLDAP, system admin),
#   jlee / Northwind-Dev-Password-2 (OpenLDAP member), apatel / Northwind-Dev-Password-3 (PostgreSQL table),
#   partner1 / Northwind-Dev-Password-4 (MySQL table).
# All passwords and keys here are for development only.
name: exprsn-ai-dev

x-dev-secrets: &dev-secrets
  SESSION_SECRET: dev-only-session-secret-0123456789abcdef0123456789abcdef
  DATA_KEY: ZGV2LW9ubHktZGF0YS1rZXktMzItYnl0ZXMtbG9uZyE=

services:
  app:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile }
    environment:
      <<: *dev-secrets
      NODE_ENV: development
      PUBLIC_URL: http://localhost:8080
      TRUST_PROXY: "false"
      DB_CLIENT: pg
      DATABASE_URL: postgres://exprsn:exprsn@postgres:5432/exprsn_ai
      REDIS_URL: redis://redis:6379
      IDENTITY_CONFIG: /etc/exprsn-ai/identity.yaml
      # identity.dev.yaml references these as env:DEV_*; nothing else is referenceable.
      SECRET_REF_ENV: DEV_*
      DEV_LDAP_ADMIN_PASSWORD: dev-ldap-admin
      DEV_HR_PG_URL: postgres://hr_readonly:hr_readonly_dev@postgres:5432/hr
      DEV_PARTNER_MYSQL_URL: mysql://portal_readonly:portal_readonly_dev@mysql:3306/portal
    volumes: ["./identity.dev.yaml:/etc/exprsn-ai/identity.yaml:ro"]
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      mysql: { condition: service_healthy }
      openldap: { condition: service_started }
      redis: { condition: service_started }

  redis:
    image: redis:8-bookworm@sha256:164c759a0c342ee69d08fc99219382b0fd682181465c0df2e0e6911f4c85d73c
    ports: ["6379:6379"]

  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment: { POSTGRES_USER: exprsn, POSTGRES_PASSWORD: exprsn, POSTGRES_DB: exprsn_ai }
    volumes:
      - ./sql/pg-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./sql/pg-hr.sql:/seed/pg-hr.sql:ro
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U exprsn"], interval: 3s, timeout: 3s, retries: 30 }

  mysql:
    image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
    environment: { MYSQL_ROOT_PASSWORD: dev-root, MYSQL_DATABASE: portal, MYSQL_USER: exprsn, MYSQL_PASSWORD: exprsn }
    volumes: ["./sql/mysql-partner.sql:/docker-entrypoint-initdb.d/10-partner.sql:ro"]
    ports: ["3306:3306"]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdev-root"], interval: 3s, timeout: 3s, retries: 40 }

  openldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    command: --copy-service
    environment:
      LDAP_ORGANISATION: Northwind
      LDAP_DOMAIN: northwind.local
      LDAP_ADMIN_PASSWORD: dev-ldap-admin
      LDAP_TLS: "false"
    volumes: ["./ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-seed.ldif:ro"]
    ports: ["389:389"]
